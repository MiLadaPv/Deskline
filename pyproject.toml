[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskline"
version = "0.5.25"
description = "Local-first Windows productivity tracker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.12",
  "mss>=9.0.1",
  "Pillow>=10.4.0",
  "pywin32>=308",
  "pystray>=0.19.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
deskline = "deskline.main:main"

[tool.setuptools.packages.find]
include = ["deskline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
