<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deskline</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #e8f0ec;
        --ink: #15241f;
      }
      html, body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(900px 480px at 10% -10%, #f2faf6 0%, transparent 55%),
          radial-gradient(700px 400px at 100% 0%, #c5ddd4 0%, transparent 50%),
          var(--bg);
        color: var(--ink);
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 2rem;
      }
      .logo {
        width: 96px;
        height: 110px;
        margin: 0 auto 1rem;
        animation: logo-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      @keyframes logo-in {
        from { opacity: 0; transform: scale(0.92); }
        to { opacity: 1; transform: scale(1); }
      }
      h1 {
        margin: 0 0 0.4rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <div class="logo" aria-hidden="true">
          <img src="./logo.png" alt="" width="96" height="110" />
        </div>
        <h1>Deskline</h1>
        <p>Запуск локального трекера…</p>
      </div>
    </main>
  </body>
</html>
