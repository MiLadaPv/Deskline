<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deskline</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #e8f0ec;
        --ink: #15241f;
        --logo-ink: #1a1f2b;
      }
      html, body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(900px 480px at 10% -10%, #f2faf6 0%, transparent 55%),
          radial-gradient(700px 400px at 100% 0%, #c5ddd4 0%, transparent 50%),
          var(--bg);
        color: var(--ink);
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 2rem;
      }
      .logo {
        width: 88px;
        height: 88px;
        margin: 0 auto 1rem;
      }
      .logo svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .logo-d {
        fill: var(--logo-ink);
        opacity: 0;
        animation: mark-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .logo-bar {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: bottom;
        animation: bar-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .logo-bar-1 { fill: #3b82f6; animation-delay: 0.18s; }
      .logo-bar-2 { fill: #14b8a6; animation-delay: 0.28s; }
      .logo-bar-3 { fill: #84cc16; animation-delay: 0.38s; }
      @keyframes mark-in {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes bar-in {
        from { opacity: 0; transform: scaleY(0.25); }
        to { opacity: 1; transform: scaleY(1); }
      }
      h1 {
        margin: 0 0 0.4rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <path class="logo-d" fill-rule="evenodd" d="M14 10h18c12.5 0 22 9.2 22 22s-9.5 22-22 22H14V10zm10 10v24h8c6.8 0 12-5.2 12-12s-5.2-12-12-12h-8z"/>
            <rect class="logo-bar logo-bar-1" x="26" y="34" width="5" height="10" rx="2.5"/>
            <rect class="logo-bar logo-bar-2" x="33.5" y="28" width="5" height="16" rx="2.5"/>
            <rect class="logo-bar logo-bar-3" x="41" y="22" width="5" height="22" rx="2.5"/>
          </svg>
        </div>
        <h1>Deskline</h1>
        <p>Запуск локального трекера…</p>
      </div>
    </main>
  </body>
</html>
