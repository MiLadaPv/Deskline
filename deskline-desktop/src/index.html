<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deskline</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3eee4;
        --ink: #1c2b26;
        --accent: #2f6f5e;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(circle at top, #fff8ec, var(--bg));
        color: var(--ink);
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        opacity: 0.75;
      }
      .pulse {
        width: 14px;
        height: 14px;
        margin: 1.25rem auto 0;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(0.85);
          opacity: 0.55;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Deskline</h1>
        <p>Запуск локального трекера…</p>
        <div class="pulse" aria-hidden="true"></div>
      </div>
    </main>
  </body>
</html>
