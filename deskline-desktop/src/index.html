<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deskline</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #e8f0ec;
        --ink: #15241f;
        --accent: #1f6b56;
      }
      html, body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(900px 480px at 10% -10%, #f2faf6 0%, transparent 55%),
          radial-gradient(700px 400px at 100% 0%, #c5ddd4 0%, transparent 50%),
          var(--bg);
        color: var(--ink);
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 2rem;
      }
      .logo {
        width: 88px;
        height: 88px;
        margin: 0 auto 1rem;
        color: var(--accent);
      }
      .logo svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .logo-d-stem,
      .logo-d-arc {
        stroke-dasharray: 90;
        stroke-dashoffset: 90;
        animation: draw 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .logo-d-arc { animation-delay: 0.12s; }
      .logo-dayline {
        stroke-dasharray: 72;
        stroke-dashoffset: 72;
        animation: draw 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.28s forwards;
      }
      .logo-now {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation:
          now-in 0.35s ease 0.85s forwards,
          now-pulse 2.4s ease-in-out 1.2s infinite;
      }
      .logo-tile {
        opacity: 0;
        animation: tile-in 0.45s ease 0.05s forwards;
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes tile-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes now-in {
        from { opacity: 0; transform: scale(0.4); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes now-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.22); opacity: 0.85; }
      }
      h1 {
        margin: 0 0 0.4rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <rect class="logo-tile" x="4" y="4" width="56" height="56" rx="14" fill="currentColor"/>
            <path class="logo-d-stem" d="M20 18v28" stroke="#f4faf7" stroke-width="4.5" stroke-linecap="round"/>
            <path class="logo-d-arc" d="M20 18h10c9 0 15 6.2 15 14s-6 14-15 14H20" stroke="#f4faf7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path class="logo-dayline" d="M15 34h9c2.5 0 4.2-2.5 7-6s5.5-6 8.5-6 4.5 2 6.5 4.8S50 34 53 34" stroke="#f4faf7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <circle class="logo-now" cx="40" cy="22" r="2.8" fill="#f4faf7"/>
          </svg>
        </div>
        <h1>Deskline</h1>
        <p>Запуск локального трекера…</p>
      </div>
    </main>
  </body>
</html>
