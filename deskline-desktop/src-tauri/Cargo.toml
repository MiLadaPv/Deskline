[package]
name = "deskline-desktop"
version = "0.5.63"
description = "Deskline — native desktop shell for the local productivity tracker"
authors = ["Deskline"]
edition = "2021"

[lib]
name = "deskline_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
