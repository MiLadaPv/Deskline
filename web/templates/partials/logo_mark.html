{# Dayline D mark — classes drive draw/pulse animation in app.css #}
<span class="logo-mark{% if anim %} logo-anim{% endif %}{% if soft %} logo-anim-soft{% endif %}"{% if size %} style="width:{{ size }}px;height:{{ size }}px"{% endif %} aria-hidden="true">
  <svg viewBox="0 0 64 64" fill="none">
    <rect class="logo-tile" x="4" y="4" width="56" height="56" rx="16" fill="currentColor" fill-opacity="0.1"/>
    <path class="logo-d-stem" d="M20 18v28" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
    <path class="logo-d-arc" d="M20 18h10c9.5 0 16 6.2 16 14s-6.5 14-16 14H20" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="logo-dayline" d="M14 34h12c3 0 5-2.5 8-6s6-6 9-6 5 2.2 7 5 3.5 5 6 5h4" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="logo-now" cx="43" cy="22" r="3.2" fill="currentColor"/>
  </svg>
</span>
