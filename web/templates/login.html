<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход · Deskline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css?v={{ version }}" />
</head>
<body class="login-body">
  <div class="atmosphere" aria-hidden="true"></div>
  <main class="login-card">
    <p class="eyebrow">Deskline</p>
    <h1 id="loginTitle">Вход</h1>
    <p class="tagline" id="loginHint">Введите пароль, чтобы открыть дашборд.</p>
    <form id="loginForm" class="login-form">
      <label id="passLabel">
        Пароль
        <input type="password" name="password" id="password" autocomplete="current-password" required minlength="4" />
      </label>
      <label class="check login-remember">
        <input type="checkbox" name="remember" id="rememberMe" />
        Запомнить меня
      </label>
      <p class="login-error" id="loginError" hidden></p>
      <button type="submit" class="btn primary" id="loginSubmit">Войти</button>
    </form>
    <p class="login-legal">
      © {{ copyright_year }} {{ company_name }} ·
      <a href="/privacy">Privacy</a> ·
      <a href="/terms">Terms</a>
    </p>
  </main>
  <script>
    async function boot() {
      const st = await fetch("/api/auth/status").then((r) => r.json());
      const form = document.getElementById("loginForm");
      const title = document.getElementById("loginTitle");
      const hint = document.getElementById("loginHint");
      const submit = document.getElementById("loginSubmit");
      const err = document.getElementById("loginError");
      const setup = !st.password_set;

      if (st.authenticated) {
        location.href = "/";
        return;
      }

      if (setup) {
        title.textContent = "Создайте пароль";
        hint.textContent = "Задайте пароль для входа. Запомните его — восстановить нельзя.";
        document.getElementById("password").autocomplete = "new-password";
        submit.textContent = "Сохранить и войти";
      }

      form.addEventListener("submit", async (ev) => {
        ev.preventDefault();
        err.hidden = true;
        const password = document.getElementById("password").value;
        const remember = document.getElementById("rememberMe").checked;
        const url = setup ? "/api/auth/setup" : "/api/auth/login";
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password, remember }),
        });
        if (!res.ok) {
          const text = await res.text();
          err.textContent = setup ? "Не удалось сохранить пароль" : "Неверный пароль";
          try {
            const j = JSON.parse(text);
            if (j.detail) err.textContent = typeof j.detail === "string" ? j.detail : err.textContent;
          } catch (_) {}
          err.hidden = false;
          return;
        }
        location.href = "/";
      });
    }
    boot().catch(() => {
      document.getElementById("loginError").textContent = "Сервер недоступен";
      document.getElementById("loginError").hidden = false;
    });
  </script>
</body>
</html>
