<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход · Deskline</title>
  <link rel="stylesheet" href="/static/css/app.css?v={{ version }}" />
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-intro" aria-label="Deskline">
      <div class="login-brand"><span class="brand-mark" aria-hidden="true">D</span>Deskline</div>
      <div>
        <p class="page-kicker">Локальный учёт времени</p>
        <h1>Работа остаётся<br />под вашим контролем.</h1>
        <p>Данные хранятся только на этом компьютере.</p>
      </div>
      <span class="login-local">Windows · Локально · Приватно</span>
    </section>
    <section class="login-card">
      <p class="page-kicker">Добро пожаловать</p>
      <h2 id="loginTitle">Вход</h2>
      <p class="login-hint" id="loginHint">Введите пароль для доступа к Deskline.</p>
    <form id="loginForm" class="login-form">
      <label id="passLabel">
        Пароль
        <input type="password" name="password" id="password" autocomplete="current-password" required minlength="4" />
      </label>
      <p class="login-error" id="loginError" hidden></p>
      <button type="submit" class="btn primary" id="loginSubmit">Войти</button>
    </form>
    </section>
  </main>
  <script>
    async function boot() {
      const st = await fetch("/api/auth/status").then((r) => r.json());
      const form = document.getElementById("loginForm");
      const title = document.getElementById("loginTitle");
      const hint = document.getElementById("loginHint");
      const submit = document.getElementById("loginSubmit");
      const err = document.getElementById("loginError");
      const setup = !st.password_set;

      if (st.authenticated) {
        location.href = "/";
        return;
      }

      if (setup) {
        title.textContent = "Создайте пароль";
        hint.textContent = "Задайте пароль для входа. Запомните его — восстановить нельзя.";
        document.getElementById("password").autocomplete = "new-password";
        submit.textContent = "Сохранить и войти";
      }

      form.addEventListener("submit", async (ev) => {
        ev.preventDefault();
        err.hidden = true;
        submit.disabled = true;
        const submitText = submit.textContent;
        submit.textContent = "Проверка…";
        const password = document.getElementById("password").value;
        const url = setup ? "/api/auth/setup" : "/api/auth/login";
        let res;
        try {
          res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password }),
          });
        } catch (_) {
          err.textContent = "Сервер недоступен";
          err.hidden = false;
          submit.disabled = false;
          submit.textContent = submitText;
          return;
        }
        if (!res.ok) {
          const text = await res.text();
          err.textContent = setup ? "Не удалось сохранить пароль" : "Неверный пароль";
          try {
            const j = JSON.parse(text);
            if (j.detail) err.textContent = typeof j.detail === "string" ? j.detail : err.textContent;
          } catch (_) {}
          err.hidden = false;
          submit.disabled = false;
          submit.textContent = submitText;
          return;
        }
        location.href = "/";
      });
    }
    boot().catch(() => {
      document.getElementById("loginError").textContent = "Сервер недоступен";
      document.getElementById("loginError").hidden = false;
    });
  </script>
</body>
</html>
